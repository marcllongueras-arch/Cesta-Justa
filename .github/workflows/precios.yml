name: Actualizar precios

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC (07:17 en España en verano)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
    inputs:
      solo:
        description: "Cadenas separadas por comas (vacío = todas)"
        required: false
        default: ""
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/precios.yml"

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Chrome automático (solo si se piden Alcampo o Bonpreu)
        if: contains(github.event.inputs.solo, 'alcampo') || contains(github.event.inputs.solo, 'bonpreu')
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Descargar precios (Mercadona, Consum, Ahorramás y Lidl)
        env:
          ONLY: ${{ github.event.inputs.solo }}
          CP: ${{ vars.CODIGO_POSTAL }}   # opcional: Settings → Secrets and variables → Actions → Variables
        run: node scraper/run.mjs

      - name: Guardar cambios
        run: |
          git config user.name "cesta-justa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A precios.json historial.json estado.json 2>/dev/null || git add estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios de precios hoy."
          else
            git commit -m "Precios $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
